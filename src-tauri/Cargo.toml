[package]
name = "skillstar"
version = "1.2.0"
description = "SkillStar - turns DOCX, PDF and other documents into Claude skill packages (local OCR, local database)"
edition = "2021"

[lib]
name = "skillstar_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# the pure-Rust embedding backend (always on for Intel macOS); for tests elsewhere
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# build as on macOS / Linux (candle instead of ONNX Runtime), to check that code path
candle-only = ["candle"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
base64 = "0.22"
arboard = { version = "3", default-features = false }
sha2 = "0.10"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
pdfium-render = { version = "0.8", default-features = false, features = ["thread_safe", "pdfium_latest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

# macOS and Linux: the embedding model through candle (pure Rust). The prebuilt ONNX
# Runtime needs glibc 2.38+ on Linux and macOS 13.4+ on Apple Silicon (and has no
# Intel macOS build), so only Windows uses it.
[target.'cfg(not(windows))'.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[target.'cfg(windows)'.dependencies]
fastembed = { version = "7.7", default-features = false, features = ["ort-download-binaries-native-tls"] }
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
