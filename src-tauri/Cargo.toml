[package]
name = "skillstar"
version = "0.1.0"
description = "SkillStar - turns DOCX, PDF and other documents into Claude skill packages (local OCR, local database)"
edition = "2021"

[lib]
name = "skillstar_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
base64 = "0.22"
arboard = { version = "3", default-features = false }
sha2 = "0.10"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
pdfium-render = { version = "0.8", default-features = false, features = ["thread_safe", "pdfium_latest"] }
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_WinRT"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
