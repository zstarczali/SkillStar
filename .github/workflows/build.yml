# Builds the SkillStar installers for every platform.
# Runs ONLY when started by hand: GitHub → Actions → "Build installers" → Run workflow
# (or: gh workflow run build.yml --ref <branch>). There is no push / PR trigger.
#
# Installers (unsigned):
#   Windows x64    NSIS .exe
#   Windows ARM64  NSIS .exe (cross-compiled on x64)
#   macOS ARM64    .dmg (Apple Silicon)
#   macOS x64      .dmg (Intel, cross-compiled on the ARM runner)
#   Linux x64      .deb, .rpm, .AppImage
name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            pdfium: pdfium-win-x64.tgz
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            pdfium: pdfium-win-arm64.tgz
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            pdfium: pdfium-mac-arm64.tgz
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            pdfium: pdfium-mac-x64.tgz
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            pdfium: pdfium-linux-x64.tgz

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # pdfium (the PDF engine of Chromium, BSD licence) goes into the installer as a resource
      - name: Bundle pdfium
        shell: bash
        run: |
          curl -fsSL -o pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium }}"
          mkdir -p pdfium-x
          tar -xzf pdfium.tgz -C pdfium-x
          find pdfium-x \( -name pdfium.dll -o -name libpdfium.dylib -o -name libpdfium.so \) -exec cp {} src-tauri/resources/pdfium/ \;
          cp pdfium-x/LICENSE src-tauri/resources/pdfium/LICENSE-pdfium.txt 2>/dev/null || true
          ls -la src-tauri/resources/pdfium

      - name: Install Tauri CLI
        run: npm ci

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: SkillStar-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Upload installation guide
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: SkillStar-installation-guide
          if-no-files-found: error
          path: |
            readme.txt
            whatsnew.txt
            LICENSE
